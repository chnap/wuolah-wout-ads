[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wuolah-wout-ads"
version = "0.4.0"
description = "Fast, local batch cleaner for promotional pages in Wuolah PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
wuolah-wout-ads = "wuolah_wout_ads.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wuolah_wout_ads"]
