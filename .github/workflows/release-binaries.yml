name: Build standalone downloads

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: wuolah-wout-ads-linux-x86_64
            asset: wuolah-wout-ads-linux-x86_64
          - os: windows-latest
            artifact: wuolah-wout-ads-windows-x86_64.exe
            asset: wuolah-wout-ads-windows-x86_64.exe
          - os: macos-13
            artifact: wuolah-wout-ads-macos-x86_64
            asset: wuolah-wout-ads-macos-x86_64
          - os: macos-14
            artifact: wuolah-wout-ads-macos-aarch64
            asset: wuolah-wout-ads-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build standalone executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean --onefile --name "${{ matrix.artifact }}" --collect-all pymupdf --collect-all fitz packaging_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: wuolah-wout-ads-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: wuolah-wout-ads ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
